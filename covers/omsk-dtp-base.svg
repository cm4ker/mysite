<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#26262a" stroke-width="0.5"/>
    </pattern>
    <clipPath id="band">
      <rect x="64" y="404" width="1072" height="132" rx="10"/>
    </clipPath>
    <filter id="glow-mid" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#256abf"/>
      <stop offset="0.5" stop-color="#6da7ec"/>
      <stop offset="1" stop-color="#cde2fb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#16161a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#ff8a00"/>

  <text x="64" y="80" fill="#6b6a63" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3">N.ZENKOV  ·  СТАТЬЯ  ·  13 МИН</text>

  <text x="64" y="220" fill="#e8e4dc" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="68">Анализ базы ДТП:</text>
  <text x="64" y="300" fill="#e8e4dc" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="68">почему автобусы <tspan fill="#ff8a00">«скрываются»</tspan></text>

  <text x="64" y="360" fill="#a89e8f" font-family="Consolas, 'Courier New', monospace" font-size="22">dtp-stat.ru · 29 732 ДТП · Омская область, 2015—2026 · ERA5</text>

  <!-- band: share of accidents where the driver "left the scene", by accident type -->
  <g clip-path="url(#band)">
    <rect x="64" y="404" width="1072" height="132" fill="#0c0c0f"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <!-- passenger fall: the outlier -->
      <rect x="330" y="413" width="436" height="14" rx="3" fill="#ff8a00" opacity="0.45" filter="url(#glow-mid)"/>
      <rect x="330" y="413" width="436" height="14" rx="3" fill="#ff8a00"/>
      <text x="80" y="425" fill="#e8e4dc">Падение пассажира</text>
      <text x="776" y="425" fill="#ff8a00">66 %</text>

      <rect x="330" y="437" width="226" height="14" rx="3" fill="#3987e5"/>
      <text x="80" y="449" fill="#a89e8f">Наезд на пешехода</text>
      <text x="566" y="449" fill="#6da7ec">34 %</text>

      <rect x="330" y="461" width="141" height="14" rx="3" fill="#2f78d0"/>
      <text x="80" y="473" fill="#a89e8f">Наезд на велосипедиста</text>
      <text x="481" y="473" fill="#6da7ec">21 %</text>

      <rect x="330" y="485" width="86" height="14" rx="3" fill="#256abf"/>
      <text x="80" y="497" fill="#a89e8f">Наезд на препятствие</text>
      <text x="426" y="497" fill="#6da7ec">13 %</text>

      <rect x="330" y="509" width="34" height="14" rx="3" fill="#1f5aa3"/>
      <text x="80" y="521" fill="#a89e8f">Столкновение</text>
      <text x="374" y="521" fill="#6da7ec">5 %</text>
    </g>
  </g>
  <rect x="64" y="404" width="1072" height="132" rx="10" fill="none" stroke="#26262a" stroke-width="1"/>

  <!-- caption row under the band -->
  <text x="64" y="562" fill="#6b6a63" font-family="Consolas, 'Courier New', monospace" font-size="13">доля ДТП, где водитель «скрылся с места», по виду происшествия · 31 084 карточки ГИБДД</text>

  <text x="64" y="592" fill="#6b6a63" font-family="Consolas, 'Courier New', monospace" font-size="14">cm4ker.ru</text>

  <g transform="translate(868, 570)">
    <rect x="0" y="0" width="268" height="34" rx="17" fill="none" stroke="#ff8a00" stroke-width="1.5"/>
    <text x="134" y="22" text-anchor="middle" fill="#ff8a00" font-family="Consolas, 'Courier New', monospace" font-size="14">↗ упал в салоне = «скрылся»</text>
  </g>

  <!-- icon: a city bus -->
  <g transform="translate(1046, 52)" fill="none" stroke="#ff8a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="14" width="76" height="46" rx="8"/>
    <path d="M 8 40 H 84"/>
    <path d="M 22 22 V 32 M 36 22 V 32 M 50 22 V 32 M 64 22 V 32"/>
    <circle cx="26" cy="64" r="6" fill="#16161a"/>
    <circle cx="66" cy="64" r="6" fill="#16161a"/>
    <path d="M 84 30 H 92" opacity="0.6"/>
    <path d="M 0 30 H 8" opacity="0.6"/>
  </g>
</svg>
